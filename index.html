<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 de Abril</title>
  <style>
    :root {
      --red-1: #ff6b6b;
      --red-2: #ff8a80;
      --red-3: #f45b69;
      --red-4: #ff7f7f;
      --red-5: #ff5252;
      --text: #fff7fb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      background: linear-gradient(-45deg, var(--red-1), var(--red-2), var(--red-3), var(--red-4), var(--red-5));
      background-size: 400% 400%;
      animation: bgShift 18s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Intro screen */
    .intro {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, var(--red-1), var(--red-2), var(--red-3), var(--red-4), var(--red-5));
      background-size: 400% 400%;
      animation: bgShift 18s ease infinite;
      z-index: 10;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      padding: 1.5rem;
      text-align: center;
    }
    .intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .intro-btn {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      animation: btnFloat 4.5s ease-in-out infinite;
      transition: transform 0.25s ease;
      line-height: 0;
    }
    .intro-btn:focus-visible {
      outline: 2px solid rgba(255,255,255,0.85);
      outline-offset: 8px;
      border-radius: 16px;
    }
    .intro-btn:hover {
      transform: translateY(-2px) scale(1.01);
    }
    .intro-btn:active {
      transform: translateY(0) scale(0.99);
    }
    .envelope {
      position: relative;
      display: block;
      width: min(112px, 32vw);
      aspect-ratio: 4 / 3;
      transition: transform 0.35s ease;
    }
    .intro-btn:hover .envelope {
      transform: translateY(-3px);
    }
    .envelope-body {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #f7ccd7;
      perspective: 320px;
      filter: drop-shadow(0 12px 18px rgba(90, 25, 45, 0.28)) drop-shadow(0 3px 5px rgba(70, 20, 35, 0.16));
      transition: filter 0.35s ease;
    }
    .intro-btn:hover .envelope-body {
      filter: drop-shadow(0 16px 24px rgba(90, 25, 45, 0.3)) drop-shadow(0 5px 8px rgba(70, 20, 35, 0.18));
    }
    .envelope-body::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
      pointer-events: none;
    }
    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #f9d8e1 0%, #f2bccb 100%);
    }
    .envelope-front {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64%;
      background: linear-gradient(180deg, #f8d7df 0%, #f0b9c7 100%);
      clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
      z-index: 3;
    }
    .envelope-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(206, 130, 152, 0.16), transparent 45%);
      pointer-events: none;
    }
    .envelope-flap {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 64%;
      background: linear-gradient(180deg, #fbe3e9 0%, #f5ccd6 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      z-index: 4;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,1)) drop-shadow(0 0 1px rgba(255,255,255,0.5)) drop-shadow(0 2px 3px rgba(176, 95, 120, 0.28));
      transition: transform 0.35s ease, filter 0.35s ease;
    }
    .envelope-flap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 45%, transparent 70%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      pointer-events: none;
    }
    .intro-btn:hover .envelope-flap {
      transform: rotateX(12deg) translateY(-1px);
      filter: brightness(1.02) drop-shadow(0 1px 0 rgba(255,255,255,1)) drop-shadow(0 0 1px rgba(255,255,255,0.55)) drop-shadow(0 3px 4px rgba(176, 95, 120, 0.3));
    }
    .envelope-seal {
      position: absolute;
      left: 50%;
      top: 54%;
      width: 44%;
      transform: translate(-50%, -50%);
      z-index: 5;
      transition: transform 0.35s ease, filter 0.35s ease;
      filter: drop-shadow(0 3px 4px rgba(150, 45, 70, 0.3));
    }
    .envelope-seal svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .envelope-seal::after {
      content: "";
      position: absolute;
      inset: 6% 8% 30% 6%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), transparent 55%);
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .intro-btn:hover .envelope-seal {
      transform: translate(-50%, -50%) scale(1.07);
      filter: drop-shadow(0 4px 7px rgba(150, 45, 70, 0.32)) brightness(1.05);
    }
    .intro-btn:hover .envelope-seal::after {
      opacity: 0.7;
    }
    .envelope-label {
      position: absolute;
      left: 50%;
      bottom: -1.35rem;
      transform: translateX(-50%);
      z-index: 6;
      font-size: clamp(0.5rem, 1.8vw, 0.62rem);
      font-weight: 600;
      color: rgba(255,255,255,0.95);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 4px rgba(110, 35, 55, 0.45);
      white-space: nowrap;
      line-height: 1;
    }

    @keyframes btnFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Fondo animado */
    .bg-animations {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.35;
      animation: drift linear infinite;
      mix-blend-mode: screen;
    }
    .float-item {
      position: absolute;
      bottom: -10vh;
      color: rgba(255, 255, 255, 0.35);
      animation: floatUp linear infinite;
      user-select: none;
      text-shadow: 0 0 10px rgba(255,255,255,0.25);
    }
    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -60px) scale(1.08); }
      66% { transform: translate(-30px, 30px) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-120vh) translateX(var(--drift)) rotate(360deg) scale(1.2); opacity: 0; }
    }

    /* Main page */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .page.visible {
      display: flex;
      animation: pageEnter 0.8s ease both;
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 560px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.4rem;
      color: #fff;
    }

    .date {
      display: inline-block;
      margin: 0.6rem 0 1.8rem;
      padding: 0.5rem 1.2rem;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
    }

    /* Carrete de fotos */
    .roll {
      --shot: min(300px, 66vw);
      position: relative;
      margin: 0 -0.25rem 1.4rem;
    }
    .roll-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding: 14px calc((100% - var(--shot)) / 2) 22px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      cursor: grab;
    }
    .roll-track::-webkit-scrollbar { display: none; }
    .roll-track.dragging {
      cursor: grabbing;
      scroll-snap-type: none;
      scroll-behavior: auto;
    }
    .shot {
      flex: 0 0 var(--shot);
      scroll-snap-align: center;
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      background: #fff;
      border: none;
      padding: 10px 10px 44px;
      border-radius: 4px;
      box-shadow: 0 14px 32px rgba(0,0,0,0.35);
      cursor: pointer;
      transform: rotate(-2deg);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .shot:nth-child(2n) { transform: rotate(1.6deg); }
    .shot:nth-child(3n) { transform: rotate(-1.2deg); }
    .shot:hover,
    .shot:focus-visible {
      transform: rotate(0deg) translateY(-5px) scale(1.02);
      box-shadow: 0 22px 42px rgba(0,0,0,0.42);
    }
    .shot:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.85);
      outline-offset: 6px;
    }
    .shot:active {
      transform: rotate(0deg) translateY(-1px) scale(0.99);
    }
    .shot img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center 38%;
      background: #f2f2f2;
      border-radius: 2px;
      pointer-events: none;
      transition: filter 0.4s ease;
    }
    .shot:hover img { filter: saturate(1.06) brightness(1.02); }
    .shot::after {
      content: "❤";
      position: absolute;
      right: 14px;
      bottom: 12px;
      font-size: 1.05rem;
      color: #ee5a78;
      opacity: 0.7;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }
    .shot:hover::after {
      transform: scale(1.25) rotate(-8deg);
      opacity: 1;
    }

    .roll-btn {
      position: absolute;
      top: 50%;
      z-index: 4;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 50%;
      background: rgba(90, 20, 40, 0.35);
      color: #fff;
      font-size: 1.35rem;
      line-height: 1;
      padding-bottom: 2px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      transform: translateY(-50%);
      transition: opacity 0.25s ease, background 0.25s ease, transform 0.2s ease;
    }
    .roll:hover .roll-btn,
    .roll-btn:focus-visible {
      opacity: 1;
    }
    .roll-btn:hover { background: rgba(90, 20, 40, 0.55); }
    .roll-btn:active { transform: translateY(-50%) scale(0.94); }
    .roll-btn:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.85);
      outline-offset: 3px;
    }
    .roll-prev { left: -2px; }
    .roll-next { right: -2px; }
    @media (hover: none) {
      .roll-btn { display: none; }
    }

    .heart-pop {
      position: absolute;
      left: 50%;
      bottom: 22%;
      z-index: 3;
      font-size: 20px;
      line-height: 1;
      color: #ff4f72;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(120, 0, 30, 0.25);
      animation: heartPop 1.1s ease-out forwards;
    }
    @keyframes heartPop {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
      15% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx, 0px)), -110px) scale(1.15) rotate(var(--rot, 0deg));
      }
    }

    /* Visor de foto */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(60, 10, 25, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      cursor: zoom-out;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      max-width: min(92vw, 720px);
      max-height: 86vh;
      width: auto;
      height: auto;
      border: 8px solid #fff;
      border-bottom-width: 42px;
      border-radius: 6px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      transform: scale(0.9) rotate(-1deg);
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .lightbox.open img {
      transform: scale(1) rotate(0deg);
    }

    .message {
      position: relative;
      font-size: 1.1rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.95);
      margin-bottom: 1.2rem;
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s ease;
    }
    .message:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .message:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.7);
      outline-offset: 6px;
    }
    .message-ghost {
      visibility: hidden;
    }
    .message-live {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .caret {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      margin-left: 1px;
      vertical-align: -0.15em;
      background: #fff;
      border-radius: 2px;
      animation: caretBlink 0.9s steps(1) infinite;
    }
    .message.done .caret {
      display: none;
    }
    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .signature {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      font-size: 1rem;
      font-style: italic;
      color: #ffe6e6;
    }
    .signature.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem; }
      .shot { padding: 8px 8px 36px; }
      .roll-track { padding: 12px calc((100% - var(--shot)) / 2) 18px; gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-animations" id="bgAnimations" aria-hidden="true"></div>

  <div class="intro" id="intro">
    <button class="intro-btn" id="enterBtn" type="button" aria-label="Abrir sobre Flor&lt;3">
      <span class="envelope">
        <span class="envelope-body">
          <span class="envelope-back"></span>
          <span class="envelope-flap"></span>
          <span class="envelope-front"></span>
        </span>
        <span class="envelope-seal" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <defs>
              <linearGradient id="heartGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e26e87" />
                <stop offset="0.55" stop-color="#d95573" />
                <stop offset="1" stop-color="#cc4666" />
              </linearGradient>
            </defs>
            <path fill="url(#heartGradient)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
          </svg>
        </span>
        <span class="envelope-label">Flor&lt;3</span>
      </span>
    </button>
  </div>

  <main class="page" id="page">
    <div class="card">
      <h1>55 Meses</h1>
      <div class="date">15 de abril</div>

      <section class="roll" id="roll" aria-label="Carrete de fotos">
        <button class="roll-btn roll-prev" id="rollPrev" type="button" aria-label="Foto anterior">‹</button>
        <div class="roll-track" id="rollTrack">
          <button class="shot" type="button" aria-label="Ver la foto 1 en grande">
            <img src="fl15.jpeg" alt="Foto especial" onerror="this.onerror=null;this.src='placeholder.svg';" />
          </button>
          <button class="shot" type="button" aria-label="Ver la foto 2 en grande">
            <img src="flo17.jpeg" alt="Flor en la cocina" onerror="this.onerror=null;this.src='placeholder.svg';" />
          </button>
          <button class="shot" type="button" aria-label="Ver la foto 3 en grande">
            <img src="flo16.jpeg" alt="Flor al atardecer" onerror="this.onerror=null;this.src='placeholder.svg';" />
          </button>
        </div>
        <button class="roll-btn roll-next" id="rollNext" type="button" aria-label="Foto siguiente">›</button>
      </section>

      <p class="message" id="message" role="button" tabindex="0" aria-label="Repetir el mensaje">
        <span class="sr-only">Feliz Mes Mi Vida, espero poder hacerte feliz siempre y que nos elijamos todos los días una vez más. Te amo con todo mi ser&lt;3.</span>
        <span class="message-ghost" aria-hidden="true">Feliz Mes Mi Vida, espero poder hacerte feliz siempre y que nos elijamos todos los días una vez más. Te amo con todo mi ser&lt;3.</span>
        <span class="message-live" aria-hidden="true"><span id="typedText"></span><span class="caret"></span></span>
      </p>
      <p class="signature">Tu Agus</p>
      <p class="signature">15/11/2026</p>
    </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <img src="fl15.jpeg" alt="Foto ampliada" onerror="this.onerror=null;this.src='placeholder.svg';" />
  </div>

  <script>
    (function () {
      const btn = document.getElementById('enterBtn');
      const intro = document.getElementById('intro');
      const page = document.getElementById('page');

      const message = document.getElementById('message');
      const ghost = message.querySelector('.message-ghost');
      const typedText = document.getElementById('typedText');
      const revealEls = Array.prototype.slice.call(document.querySelectorAll('.signature'));
      const track = document.getElementById('rollTrack');
      const shots = Array.prototype.slice.call(track.querySelectorAll('.shot'));
      const rollPrev = document.getElementById('rollPrev');
      const rollNext = document.getElementById('rollNext');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = lightbox.querySelector('img');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const fullText = (ghost.textContent || '').replace(/\s+/g, ' ').trim();
      let typeTimer = null;
      let revealTimers = [];
      let typing = false;
      let index = 0;
      let lightboxTimer = null;

      function clearTimers(list) {
        list.forEach(clearTimeout);
        list.length = 0;
      }

      function revealExtras() {
        clearTimers(revealTimers);
        revealEls.forEach(function (el, i) {
          revealTimers.push(setTimeout(function () {
            el.classList.add('revealed');
          }, reduceMotion ? 0 : 160 + i * 220));
        });
      }

      function hideExtras() {
        clearTimers(revealTimers);
        revealEls.forEach(function (el) { el.classList.remove('revealed'); });
      }

      function finishTyping() {
        clearTimeout(typeTimer);
        typeTimer = null;
        typing = false;
        index = fullText.length;
        typedText.textContent = fullText;
        message.classList.add('done');
        revealExtras();
      }

      function startTyping() {
        if (!fullText) return;
        clearTimeout(typeTimer);
        hideExtras();
        message.classList.remove('done');
        typedText.textContent = '';
        index = 0;

        if (reduceMotion) { finishTyping(); return; }

        typing = true;
        (function step() {
          if (index >= fullText.length) { finishTyping(); return; }
          const ch = fullText.charAt(index);
          typedText.textContent += ch;
          index += 1;
          let wait = 24 + Math.random() * 34;
          if (ch === ',') wait += 170;
          else if (ch === '.') wait += 250;
          else if (ch === ' ') wait = 22;
          typeTimer = setTimeout(step, wait);
        })();
      }

      message.addEventListener('click', function () {
        if (typing) finishTyping();
        else startTyping();
      });
      message.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (typing) finishTyping();
          else startTyping();
        }
      });

      btn.addEventListener('click', function () {
        if (page.classList.contains('visible')) return;
        intro.classList.add('hidden');
        page.classList.add('visible');
        btn.blur();
        setTimeout(startTyping, reduceMotion ? 0 : 450);
      });

      /* Carrete: corazones, arrastre y visor */
      function burstHearts(container, clientX, clientY) {
        if (reduceMotion || !container) return;
        const rect = container.getBoundingClientRect();
        let originX = 50;
        let originY = 34;
        if (typeof clientX === 'number' && typeof clientY === 'number') {
          originX = ((clientX - rect.left) / rect.width) * 100;
          originY = (1 - (clientY - rect.top) / rect.height) * 100;
        }
        const symbols = ['❤', '♥', '💖', '✦'];
        for (let i = 0; i < 8; i++) {
          const h = document.createElement('span');
          h.className = 'heart-pop';
          h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          h.style.left = Math.max(4, Math.min(96, originX + (Math.random() * 18 - 9))) + '%';
          h.style.bottom = Math.max(6, Math.min(88, originY)) + '%';
          h.style.fontSize = (13 + Math.random() * 13).toFixed(1) + 'px';
          h.style.setProperty('--dx', (Math.random() * 90 - 45).toFixed(0) + 'px');
          h.style.setProperty('--rot', (Math.random() * 80 - 40).toFixed(0) + 'deg');
          h.style.animationDelay = (i * 45) + 'ms';
          container.appendChild(h);
          h.addEventListener('animationend', function () { h.remove(); });
        }
      }

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || 'Foto ampliada';
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
      }
      function closeLightbox() {
        clearTimeout(lightboxTimer);
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
      }
      function handleShot(shot, e) {
        burstHearts(shot, e ? e.clientX : null, e ? e.clientY : null);
        const img = shot.querySelector('img');
        if (reduceMotion) { openLightbox(img.currentSrc || img.src, img.alt); return; }
        clearTimeout(lightboxTimer);
        lightboxTimer = setTimeout(function () {
          openLightbox(img.currentSrc || img.src, img.alt);
        }, 320);
      }

      let dragging = false;
      let dragStartX = 0;
      let dragStartScroll = 0;
      let dragMoved = false;
      let suppressClick = false;
      let suppressTimer = null;

      function stopDrag() {
        if (!dragging) return;
        dragging = false;
        track.classList.remove('dragging');
        if (dragMoved) {
          suppressClick = true;
          clearTimeout(suppressTimer);
          suppressTimer = setTimeout(function () { suppressClick = false; }, 350);
        }
      }

      track.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'touch' || e.button !== 0) return;
        dragging = true;
        dragMoved = false;
        dragStartX = e.clientX;
        dragStartScroll = track.scrollLeft;
        track.classList.add('dragging');
      });
      track.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        const dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 6) dragMoved = true;
        if (dragMoved) {
          track.scrollLeft = dragStartScroll - dx;
          e.preventDefault();
        }
      });
      track.addEventListener('pointerup', stopDrag);
      track.addEventListener('pointercancel', stopDrag);
      track.addEventListener('pointerleave', stopDrag);
      window.addEventListener('pointerup', stopDrag);

      shots.forEach(function (shot) {
        shot.addEventListener('dragstart', function (e) { e.preventDefault(); });
        shot.addEventListener('click', function (e) {
          if (suppressClick) {
            suppressClick = false;
            e.preventDefault();
            return;
          }
          handleShot(shot, e);
        });
      });

      function scrollOne(dir) {
        const first = shots[0];
        if (!first) return;
        const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
        const step = first.getBoundingClientRect().width + gap;
        track.scrollBy({ left: dir * step, behavior: reduceMotion ? 'auto' : 'smooth' });
      }
      rollPrev.addEventListener('click', function () { scrollOne(-1); });
      rollNext.addEventListener('click', function () { scrollOne(1); });
      track.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          scrollOne(1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          scrollOne(-1);
        }
      });

      lightbox.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
      });

      const bg = document.getElementById('bgAnimations');
      const colors = ['rgba(255,255,255,0.25)', 'rgba(255,205,210,0.35)', 'rgba(255,138,128,0.3)', 'rgba(255,235,238,0.25)'];
      for (let i = 0; i < 7; i++) {
        const b = document.createElement('div');
        b.className = 'blob';
        const size = 120 + Math.random() * 220;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.top = Math.random() * 100 + 'vh';
        b.style.background = colors[Math.floor(Math.random() * colors.length)];
        b.style.animationDuration = (18 + Math.random() * 18) + 's';
        b.style.animationDelay = (-Math.random() * 20) + 's';
        bg.appendChild(b);
      }

      const symbols = ['❤', '♥', '✦', '✧', '•'];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('span');
        el.className = 'float-item';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        const size = 12 + Math.random() * 20;
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = size + 'px';
        el.style.animationDuration = (12 + Math.random() * 16) + 's';
        el.style.animationDelay = (-Math.random() * 14) + 's';
        el.style.setProperty('--drift', (Math.random() * 120 - 60).toFixed(0) + 'px');
        bg.appendChild(el);
      }
    })();
  </script>
</body>
</html>
